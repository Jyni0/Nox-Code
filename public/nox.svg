<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1a2b"/>
      <stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>
    <linearGradient id="moon" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ece8ff"/>
      <stop offset="0.45" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#3b2a8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="328" cy="176" r="160" fill="#000"/>
    </mask>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="240" cy="272" r="220" fill="url(#glow)"/>
  <!-- Crescent: a full moon with an offset circle cut away -->
  <circle cx="240" cy="272" r="172" fill="url(#moon)" mask="url(#cut)"/>
  <!-- The one star that is always up when you are -->
  <path d="M384 72 L401 125 L454 142 L401 159 L384 212 L367 159 L314 142 L367 125 Z" fill="#ffffff"/>
  <circle cx="440" cy="236" r="7" fill="#ffffff" opacity="0.6"/>
  <circle cx="300" cy="96" r="5" fill="#ffffff" opacity="0.45"/>
</svg>
