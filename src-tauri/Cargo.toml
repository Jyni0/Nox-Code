[package]
name = "noxcode"
version = "1.7.6"
description = "Nox Code — a code editor for the night shift"
authors = ["Nox Code"]
edition = "2021"

[lib]
name = "noxcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Project walking that honours .gitignore (file finder, project search).
ignore = "0.4"
regex = "1"
# Live file tree / buffer reload when files change on disk.
notify = "8"
# Integrated terminal (ConPTY on Windows).
portable-pty = "0.9"
# "Delete" moves to the Recycle Bin instead of destroying files.
trash = "5"
base64 = "0.22"

# WebView2 settings Tauri does not expose (browser shortcuts, Ctrl+wheel zoom).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
